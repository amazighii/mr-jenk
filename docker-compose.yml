services:

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    # Run as root inside the container so it has permissions to access the mounted socket
    user: root 

    networks:
      - shared-net

    ports:
      - "${JENKINS_PORT:-8085}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount the host Docker socket (Allows Jenkins to talk to your host Docker Engine)
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the host Docker CLI binaries so the 'docker' command works inside Jenkins
      - /usr/bin/docker:/usr/bin/docker
      # Mount the compose plugin so 'docker compose' works as well
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose 

  # MongoDB - Users

  mongodb_users:
    image: mongo:7
    container_name: mongodb_users
    restart: unless-stopped

    networks:
      - users-net

    expose:
      - "27017"

    volumes:
      - mongodb_users_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB - Products

  mongodb_products:
    image: mongo:7
    container_name: mongodb_products
    restart: unless-stopped

    networks:
      - products-net

    expose:
      - "27017"

    volumes:
      - mongodb_products_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB - Media

  mongodb_media:
    image: mongo:7
    container_name: mongodb_media
    restart: unless-stopped

    networks:
      - media-net

    expose:
      - "27017"

    volumes:
      - mongodb_media_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Kafka

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: unless-stopped

    networks:
      - shared-net

    expose:
      - "9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # MinIO

  minio:
    image: minio/minio
    container_name: minio-server
    restart: unless-stopped

    networks:
      - media-net

    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

  # Eureka Server

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    # image: buy01/eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped

    networks:
      - shared-net

    expose:
      - "${EUREKA_SERVER_PORT:-8761}"

    ports:
      - "${EUREKA_SERVER_PORT:-8761}:${EUREKA_SERVER_PORT:-8761}"

    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:$${SERVER_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # User Service

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    # image: buy01/user-service:latest
    container_name: user-service
    restart: unless-stopped

    depends_on:
      mongodb_users:
        condition: service_healthy

      kafka:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - users-net
      - shared-net

    expose:
      - "${USER_SERVICE_SERVER_PORT:-8081}"

    environment:
      SERVER_PORT: ${USER_SERVICE_SERVER_PORT:-8081}

      SPRING_APPLICATION_NAME: ${USER_SERVICE_NAME:-USER-SERVICE}

      SPRING_DATA_MONGODB_URI: ${USER_MONGODB_URI:-mongodb://mongodb_users:27017/usersdb}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://eureka-server:8761/eureka}

      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-here-change-in-prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

  # Product Service

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    # image: buy01/product-service:latest
    container_name: product-service
    restart: unless-stopped

    depends_on:
      mongodb_products:
        condition: service_healthy

      kafka:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - products-net
      - shared-net

    expose:
      - "${PRODUCT_SERVICE_SERVER_PORT:-8082}"

    environment:
      SERVER_PORT: ${PRODUCT_SERVICE_SERVER_PORT:-8082}

      SPRING_APPLICATION_NAME: ${PRODUCT_SERVICE_NAME:-PRODUCT-SERVICE}

      SPRING_DATA_MONGODB_URI: ${PRODUCT_MONGODB_URI:-mongodb://mongodb_products:27017/productsdb}
      SPRING_DATA_MONGODB_DATABASE: ${PRODUCT_MONGODB_DATABASE:-productsdb}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${PRODUCT_KAFKA_CONSUMER_GROUP_ID:-product-service-group}
      SPRING_KAFKA_PRODUCER_RETRIES: ${PRODUCT_KAFKA_PRODUCER_RETRIES:-3}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://eureka-server:8761/eureka}

      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-here-change-in-prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

  # Media Service

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    # image: buy01/media-service:latest
    container_name: media-service
    restart: unless-stopped

    depends_on:
      mongodb_media:
        condition: service_healthy

      kafka:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      minio:
        condition: service_started

    networks:
      - media-net
      - shared-net

    expose:
      - "${MEDIA_SERVICE_SERVER_PORT:-8083}"

    environment:
      SERVER_PORT: ${MEDIA_SERVICE_SERVER_PORT:-8083}

      SPRING_APPLICATION_NAME: ${MEDIA_SERVICE_NAME:-MEDIA-SERVICE}

      SPRING_DATA_MONGODB_URI: ${MEDIA_MONGODB_URI:-mongodb://mongodb_media:27017/mediadb}
      SPRING_DATA_MONGODB_DATABASE: ${MEDIA_MONGODB_DATABASE:-mediadb}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${MEDIA_KAFKA_CONSUMER_GROUP_ID:-media-service-group}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://eureka-server:8761/eureka}

      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}

      MINIO_ACCESS_NAME: ${MINIO_ACCESS_NAME:-minio}

      MINIO_ACCESS_SECRET: ${MINIO_ACCESS_SECRET:-change-me}

      MINIO_BUCKET: ${MINIO_BUCKET:-buy01-media}
      MEDIA_ORPHAN_MAX_AGE_MINUTES: ${MEDIA_ORPHAN_MAX_AGE_MINUTES:-1}
      MEDIA_ORPHAN_CLEANUP_FIXED_RATE_MS: ${MEDIA_ORPHAN_CLEANUP_FIXED_RATE_MS:-60000}

  # Gateway

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    # image: buy01/gateway:latest
    container_name: gateway
    restart: unless-stopped

    depends_on:
      eureka-server:
        condition: service_healthy

      user-service:
        condition: service_started

      product-service:
        condition: service_started

      media-service:
        condition: service_started

    networks:
      - shared-net
      - users-net
      - products-net
      - media-net

    ports:
      - "${GATEWAY_SERVER_PORT:-8080}:${GATEWAY_SERVER_PORT:-8080}"

    volumes:
      - "${GATEWAY_SSL_KEY_STORE_HOST_PATH:-./certs/localhost.p12}:${GATEWAY_SSL_KEY_STORE:-/certs/localhost.p12}:ro"

    environment:
      SERVER_PORT: ${GATEWAY_SERVER_PORT:-8080}
      SERVER_SSL_ENABLED: ${GATEWAY_SSL_ENABLED:-true}
      SERVER_SSL_KEY_STORE: ${GATEWAY_SSL_KEY_STORE:-/certs/localhost.p12}
      SERVER_SSL_KEY_STORE_PASSWORD: ${GATEWAY_SSL_KEY_STORE_PASSWORD:-changeit}
      SERVER_SSL_KEY_STORE_TYPE: ${GATEWAY_SSL_KEY_STORE_TYPE:-PKCS12}
      SERVER_SSL_KEY_ALIAS: ${GATEWAY_SSL_KEY_ALIAS:-localhost}

      SPRING_APPLICATION_NAME: ${GATEWAY_NAME:-GATEWAY}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://eureka-server:8761/eureka}

      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-here-change-in-prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:4200}

  # Frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # image: buy01/frontend:latest
    container_name: frontend
    restart: unless-stopped

    depends_on:
      gateway:
        condition: service_started

    networks:
      - shared-net

    ports:
      - "${FRONTEND_HOST_PORT:-4200}:443"

    volumes:
      - "${FRONTEND_SSL_CERTIFICATE_HOST_PATH:-./certs/localhost.pem}:${FRONTEND_SSL_CERTIFICATE:-/certs/localhost.pem}:ro"
      - "${FRONTEND_SSL_CERTIFICATE_KEY_HOST_PATH:-./certs/localhost-key.pem}:${FRONTEND_SSL_CERTIFICATE_KEY:-/certs/localhost-key.pem}:ro"

    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-https://localhost:8080}

# Networks
networks:
  shared-net:
    driver: bridge

  users-net:
    driver: bridge
    internal: true

  products-net:
    driver: bridge
    internal: true

  media-net:
    driver: bridge
    internal: false

# Volumes
volumes:
  mongodb_users_data:
  mongodb_products_data:
  mongodb_media_data:
  minio_data:
  jenkins_home:
