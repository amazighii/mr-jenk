services:
  # --- Databases ---
  mongodb_users:
    image: mongo:latest
    container_name: mongodb_users
    networks:
      - app-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb_users_data:/data/db

  mongodb_products:
    image: mongo:latest
    container_name: mongodb_products
    networks:
      - app-network
    ports:
      - "27018:27017"
    volumes:
      - mongodb_products_data:/data/db

  mongodb_media:
    image: mongo:latest
    container_name: mongodb_media
    networks:
      - app-network
    ports:
      - "27019:27017"
    volumes:
      - mongodb_media_data:/data/db

  # --- Kafka ---
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    networks:
      - app-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  minio:
    image: minio/minio
    container_name: minio-server
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: amazighi
      MINIO_ROOT_PASSWORD: secretamazighi
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_users_data:
  mongodb_products_data:
  mongodb_media_data:
  minio_data:
