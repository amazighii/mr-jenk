# Debug logging
# logging.level.org.springframework.cloud.gateway=DEBUG
# logging.level.reactor.netty.http.client=DEBUG

management.endpoints.web.exposure.include=gateway

spring.cloud.gateway.discovery.locator.enabled=true

# Give Eureka time to sync
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5


# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-in-prod}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8443}

# Swagger/OpenAPI aggregation (Gateway UI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user-service
springdoc.swagger-ui.urls[1].name=product-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/product-service
springdoc.swagger-ui.urls[2].name=media-service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/media-service
