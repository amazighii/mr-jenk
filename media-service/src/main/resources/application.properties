spring.application.name=MEDIA-SERVICE

server.port=8083

spring.mongodb.uri=mongodb://localhost:27019/mediadb

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


minio.url=http://localhost:9000
minio.access.name=amazighi
minio.access.secret=secretamazighi
minio.bucket.name=buy01-media


spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Kafka Connection
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=media-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# Key Deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Value Deserializer (Safety Wrapper)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.buy01.media.dto.ProductEvent
